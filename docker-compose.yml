version: '3.8'

services:
  # 1. Fastify Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      # База лежит в примонтированном томе
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - sqlite_data:/app/data

  # 2. Vite React SPA Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always

  # 3. NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"     # для редиректа на HTTPS
      - "443:443"   # для HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web

volumes:
  sqlite_data: